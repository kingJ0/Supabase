name: Keep Supabase Alive

on:
  schedule:
    # 매일 한국 시간 오전 9시(00:00 UTC) 실행
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Auth & DB Engines
        run: |
          echo "1. Pinging Auth Health Check..."
          curl -i -s -X GET 'https://ijihafavwauwfvrqfuyv.supabase.co/auth/v1/health' \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}"
          
          echo -e "\n\n2. Querying Database Schema..."
          curl -i -s -X GET 'https://ijihafavwauwfvrqfuyv.supabase.co/rest/v1/' \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}"
