name: Supabase Keep Alive

on:
  schedule:
    # 매일 실행
    # UTC 03:00 = 한국시간 12:00
     - cron: '0 3,11,19 * * *'

  # GitHub Actions에서 수동 실행 가능
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NEXT_SERVICE_ROLE_KEY }}

        run: |
          set -e

          echo "Pinging Supabase..."

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output response.txt \
            --write-out "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/keeper_table?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")

          echo "HTTP Status: ${HTTP_STATUS}"
          echo "Response:"
          cat response.txt

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Supabase keep-alive successful."
          else
            echo "Supabase keep-alive failed."
            exit 1
          fi
